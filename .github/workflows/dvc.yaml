name: Run DVC Pipeline

on:
  push:
    branches:
      - version-control

jobs:
  run-dvc-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install DVC with Google Drive support
        run: |
          pip install dvc[gdrive]

      - name: Pull data and models from DVC remote
        run: dvc pull

      - name: Run DVC pipeline
        run: dvc repro
