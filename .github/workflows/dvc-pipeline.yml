name: Run DVC Pipeline

on:
  push:
    branches:
      - version-control

jobs:
  run-dvc-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install DVC with S3 support
        run: |
          pip install dvc[s3]

      - name: Set up DVC
        run: |
          dvc pull  # fetch data/models from remote
          dvc repro # run pipeline
