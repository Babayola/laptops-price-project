name: Run DVC Pipeline

on:
  push:
    branches:
      - version-control

jobs:
  run-dvc-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install dvc[s3]
          pip install -r requirements.txt

      - name: Set up DVC and run pipeline
        run: |
          dvc pull --force
          dvc repro 
